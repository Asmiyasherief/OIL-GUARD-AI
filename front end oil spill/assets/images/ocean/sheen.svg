<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="oceanSheenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3252" />
      <stop offset="100%" stop-color="#14426b" />
    </linearGradient>
    <linearGradient id="rainbowSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ff3" stop-opacity="0.5" />
      <stop offset="20%" stop-color="#feca57" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#1dd1a1" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#54a0ff" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#5f27cd" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#oceanSheenBg)" />

  <!-- Natural ambient wave lines -->
  <g opacity="0.25" stroke="#a0e0ff" stroke-width="1" fill="none">
    <path d="M0,80 Q150,60 300,80 T600,75" />
    <path d="M0,150 Q160,135 320,155 T600,145" />
    <path d="M0,230 Q140,210 310,230 T600,220" />
    <path d="M0,320 Q170,300 350,325 T600,315" />
  </g>

  <!-- Sheen streaks -->
  <path d="M 80,180 C 140,110 320,100 450,150 C 530,190 480,290 380,310 C 260,330 110,270 80,180 Z"
        fill="url(#rainbowSheen)" />
  <path d="M 160,160 C 230,120 370,130 420,180 C 450,230 380,260 290,260 C 210,250 140,210 160,160 Z"
        fill="#ffffff" opacity="0.15" />

  <!-- HUD overlay -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#ffb703" stroke-width="0.8" stroke-dasharray="12 24" opacity="0.4" />
  <rect x="70" y="110" width="450" height="210" fill="none" stroke="#ffb703" stroke-width="1.6" stroke-dasharray="6 4" />
  <rect x="70" y="90" width="220" height="20" fill="#ffb703" opacity="0.9" />
  <text x="78" y="104" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SURFACE SHEEN DETECTED (86%)</text>
  <text x="35" y="45" fill="#ffb703" font-family="'JetBrains Mono', monospace" font-size="10">SAMPLE: PATROL BOAT CAMERA [SURFACE FILM WATCH]</text>
</svg>

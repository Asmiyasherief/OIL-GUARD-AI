  <text x="43" y="51" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">STATUS: CLEAN WATER (96%)</text>
  <text x="35" y="80" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="10">NO ANOMALOUS DAMPENING OR PETROLEUM SIGNATURE</text>

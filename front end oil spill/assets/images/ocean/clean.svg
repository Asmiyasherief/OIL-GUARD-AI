  </defs>

  <rect width="600" height="400" fill="url(#cleanWaterBg)" />

  <!-- Active natural wave clutter and foam crests -->
  <g opacity="0.45" stroke="#e0f2fe" stroke-width="1.6" fill="none">
    <path d="M0,50 Q100,35 200,50 T400,45 T600,50" />
    <path d="M0,110 Q140,90 280,110 T560,105 T600,110" />
    <path d="M0,175 Q120,155 240,175 T480,170 T600,175" />
    <path d="M0,240 Q160,220 320,240 T580,235 T600,240" />
    <path d="M0,310 Q110,290 220,310 T440,305 T600,310" />
    <path d="M0,370 Q150,350 300,370 T570,365 T600,370" />
  </g>

  <!-- Foam crests -->
  <circle cx="210" cy="110" r="3" fill="#ffffff" opacity="0.6" />
  <circle cx="225" cy="112" r="2" fill="#ffffff" opacity="0.5" />
  <circle cx="450" cy="172" r="3.5" fill="#ffffff" opacity="0.6" />
  <circle cx="160" cy="238" r="3" fill="#ffffff" opacity="0.5" />
  <circle cx="340" cy="308" r="4" fill="#ffffff" opacity="0.7" />

  <!-- HUD overlay -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- SAR Radar Greyscale / Viridis Colormap -->
    <linearGradient id="sarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Dark backscatter depression (oil damping roughness) -->
    <radialGradient id="sarDarkPatch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#030712" stop-opacity="0.98" />
      <stop offset="60%" stop-color="#0b1120" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.0" />
    </radialGradient>

    <!-- Radar Speckle Pattern -->
    <pattern id="radarSpeckle" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#475569" opacity="0.35" />
      <rect x="4" y="4" width="2" height="2" fill="#64748b" opacity="0.25" />
      <rect x="2" y="6" width="1.5" height="1.5" fill="#94a3b8" opacity="0.2" />
    </pattern>
  </defs>

  <!-- SAR Image Background -->
  <rect width="600" height="400" fill="url(#sarBg)" />
  <rect width="600" height="400" fill="url(#radarSpeckle)" />

  <!-- Coastline Contour Line (Simulated Kerala Coast) -->
  <path d="M 480,0 C 470,80 495,180 510,260 C 525,320 540,360 550,400 L 600,400 L 600,0 Z"
        fill="#334155" opacity="0.6" stroke="#94a3b8" stroke-width="1.5" />
  <text x="525" y="140" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11" transform="rotate(80 525,140)">KERALA COASTLINE</text>

  <!-- Dark-Patch SAR Anomaly (Roughness Attenuation) -->
  <path d="M 230,160 C 270,120 360,130 410,180 C 440,220 420,290 350,300 C 280,310 210,270 200,220 C 195,190 210,175 230,160 Z"
        fill="url(#sarDarkPatch)" stroke="#00e5ff" stroke-width="1.8" stroke-dasharray="6 4" />

  <!-- Vessel Radar Point Target (High Backscatter Reflection) -->
  <circle cx="215" cy="175" r="4" fill="#ffffff" stroke="#ff3366" stroke-width="2" />
  <circle cx="215" cy="175" r="10" fill="none" stroke="#ff3366" stroke-width="1" stroke-dasharray="2 2" />
  <text x="140" y="165" fill="#ff3366" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">TARGET: MV OCEAN STAR</text>

  <!-- SAR Polarimetric Grid Overlay -->
  <line x1="100" y1="50" x2="500" y2="50" stroke="#00e5ff" stroke-width="0.5" opacity="0.3" />
  <line x1="100" y1="150" x2="500" y2="150" stroke="#00e5ff" stroke-width="0.5" opacity="0.3" />
  <line x1="100" y1="250" x2="500" y2="250" stroke="#00e5ff" stroke-width="0.5" opacity="0.3" />
  <line x1="100" y1="350" x2="500" y2="350" stroke="#00e5ff" stroke-width="0.5" opacity="0.3" />

  <!-- SAR Acquisition Banner -->
  <rect x="20" y="20" width="360" height="42" fill="#0f172a" opacity="0.85" rx="4" stroke="#00e5ff" stroke-width="0.8" />
  <text x="30" y="36" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">COPERNICUS SENTINEL-1B | SAR C-BAND (IW / VV+VH)</text>
  <text x="30" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">PASS: 2026-09-18 08:42:15 UTC | RES: 10M | ATTENUATION: -5.8 dB</text>

  <rect x="340" y="350" width="240" height="32" fill="#0f172a" opacity="0.9" rx="4" stroke="#ffb703" stroke-width="0.8" />
  <text x="350" y="370" fill="#ffb703" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">SUPPORTING RADAR EVIDENCE (NOT LIVE)</text>
</svg>
